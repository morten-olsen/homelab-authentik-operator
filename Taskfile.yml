version: '3'

tasks:
  ci:quality:
    desc: Build, test controllers and access reconciliation, validate generated CRDs and chart
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    cmds:
      - make test
      - go build -o bin/manager ./cmd
      - helm lint charts/authentik-operator
      - helm template authentik charts/authentik-operator --namespace authentik --include-crds --skip-tests > bin/rendered.yaml
      - git diff --exit-code -- api/v1alpha1/zz_generated.deepcopy.go config/crd/bases config/rbac/role.yaml
      - for path in config/crd/bases/*.yaml; do cmp "$path" "charts/authentik-operator/crds/$(basename "$path")"; done
